[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback so any deep link still loads the app.
# Netlify always resolves /.netlify/functions/* to functions first, regardless
# of this catch-all, so it does not interfere with the search-programs function.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
