[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so any deep link still loads the app.
# Edge Functions (netlify/edge-functions/) declare their own path via
# `export const config`, and Netlify always resolves those before this
# catch-all, so it does not interfere with /api/search-programs.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
